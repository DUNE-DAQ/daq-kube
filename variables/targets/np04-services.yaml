---
# cluster ID must be unique across mesh
kubernetesClusterID: 1

# IPs we can use at NP04
clusterPoolIPv4PodCIDRList:
  - "10.244.0.0/16"

cvmfs_csi:
  http_proxy: http://ca-proxy.cern.ch:3128;DIRECT

development_instance: true

grafana:
{% if args.with_dune_applications %}
  home_dashboard_path: /tmp/dashboards/DUNE/daq_overview.json
{% endif %}
  extra_datasources:
    prometheus-np04-daq:
      apiVersion: 1
      datasources:
      - name: prometheus-np04-daq
        type: prometheus
        uid: prometheus-np04-daq
        url: http://np04-srv-016.cern.ch:31093
        access: proxy
        jsonData:
          timeInterval: 30s
          prometheusType: Prometheus
