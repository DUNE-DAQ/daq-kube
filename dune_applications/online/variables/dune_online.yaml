dune_online:
  kafka:
    namespace: kafka
    name: dune-daq
  unified_microservices:
    image: ghcr.io/dune-daq/microservices
    tag: "v4.1.0" # note this must always be a quoted string!
  connection_service:
    image: ghcr.io/dune-daq/connectivityserver
    tag: "v2.0.0" # note this must always be a quoted string!
  elisa_logbook: # needs to be defined here so we can use in deployment templates
    namespace: elisa-logbook
    username: rcpd
    password: "{{ args.elisa_password }}"
    hardware_types:
      - npvd
      - pdsp
      - pddp
