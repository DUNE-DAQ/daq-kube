---
deployments:
  - path: namespace
    alwaysDeploy: true

  - barrier: true
    message: We need a namespace to deploy into

  - path: cnpg
    waitReadiness: true

  - barrier: true
    message: cnpg needs to settle (about 2m)

  - path: cnpg-artifacts/image-catalogs
    onlyRender: true

  - path: cnpg-artifacts/image-catalogs-extensions

vars:
  - file: variables/cnpg.yaml
