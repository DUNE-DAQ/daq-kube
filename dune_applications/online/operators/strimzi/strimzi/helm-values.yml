---
featureGates: ""

watchAnyNamespace: true

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ kubernetes_labels.node_worker }}
              operator: Exists

podDisruptionBudget:
  enabled: true
  minAvailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow

operatorNetworkPolicy:
  enabled: true
  # it is impossible to define a rational port list in advance
  # kafka and its services will take a list of ports, but they
  # are dynamically moving about in "cloud scale" ways
  egress:
  - {}

{% if inside_kind %}
hostUsers: true
{% else %}
hostUsers: false
{% endif %}

securityContext:
  runAsUser: 10000
  runAsGroup: 10000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 10000

extraEnvs:
  - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
    value: restricted

dashboards:
  enabled: true
  label: {{ grafana_dashboard_label_name }}
  labelValue: {{ grafana_dashboard_label_value }}
  annotations:
    {{ grafana_dashboard_folder_annotation }}: Kafka
