---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ dune_online_ers.namespace }}

resources:
  - ers-dbwriter-deployment.yaml

patches:
  - target:
      kind: Namespace
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: {{ dune_online.unified_microservices.image }}:{{ dune_online.unified_microservices.tag }}
      - op: replace
        path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/key
        value: {{ kubernetes_labels.node_worker }}
      - op: add
        path: /spec/template/spec/hostUsers
{% if inside_kind %}
        value: true
{% else %}
        value: false
{% endif %}

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: {{ dune_online.kafka.name}}-kafka-bootstrap.{{ dune_online.kafka.namespace }}.svc:9092
      - op: replace
        path: /spec/template/spec/containers/0/env/5/valueFrom/secretKeyRef/name
        value: {{ dune_online_ers.database.postgresql.deployment }}-{{ dune_online_ers.database.postgresql.owner }}-password
      - op: replace
        path: /spec/template/spec/containers/0/env/5/valueFrom/secretKeyRef/key
        value: pyuri
      - op: replace
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 65534
