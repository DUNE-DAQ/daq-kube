---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob.yaml
  - pvc.yaml

patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/hostUsers
{% if inside_kind %}
        value: true
{% else %}
        value: false
{% endif %}
