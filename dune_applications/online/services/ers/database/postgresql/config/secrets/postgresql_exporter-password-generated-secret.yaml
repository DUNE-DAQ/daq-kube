---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ dune_online_ers.database.postgresql.deployment }}-postgresql-exporter-password
  namespace: {{ dune_online_ers.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: postgresql_exporter
{% raw %}
        password: "{{ .uuid }}"
{% endraw %}
        database: {{ dune_online_ers.database.postgresql.database }}
        host: {{ dune_online_ers.database.postgresql.deployment }}-r.{{ dune_online_ers.namespace }}.svc
        port: '5432'
        uri: "postgresql://postgresql_exporter:{% raw %}{{ .uuid }}{% endraw %}@{{ dune_online_ers.database.postgresql.deployment }}-r.{{ dune_online_ers.namespace }}.svc:5432/{{ dune_online_ers.database.postgresql.database }}"
  dataFrom:
    - sourceRef:
        generatorRef: {{ external_secrets.uuid | tojson }}
