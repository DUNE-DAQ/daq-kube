---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ dune_online_ers.database.postgresql.deployment }}-readonly-password
  namespace: {{ dune_online_ers.namespace }}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef: {{ external_secrets.kubernetes_secretStore | tojson }}
  target:
    creationPolicy: Orphan
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: readonly
{% raw %}
        password: "{{ .password }}"
{% endraw %}
        database: {{ dune_online_ers.database.postgresql.database }}
        host: {{ dune_online_ers.database.postgresql.deployment }}-r.{{ dune_online_ers.namespace }}.svc
        port: '5432'
        uri: "postgresql://readonly:{% raw %}{{ .password }}{% endraw %}@{{ dune_online_ers.database.postgresql.deployment }}-r.{{ dune_online_ers.namespace }}.svc:5432/{{ dune_online_ers.database.postgresql.database }}"
        pyuri: "postgresql+psycopg://readonly:{% raw %}{{ .password }}{% endraw %}@{{ dune_online_ers.database.postgresql.deployment }}-r.{{ dune_online_ers.namespace }}.svc:5432/{{ dune_online_ers.database.postgresql.database }}"
  data:
    - secretKey: password
      remoteRef: {{ external_secrets.static_password | tojson }}
