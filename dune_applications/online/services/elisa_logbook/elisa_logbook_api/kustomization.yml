---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ dune_online.elisa_logbook.namespace }}

resources:
  - elisa-logbook-deployment.yaml

patches:
  - target:
      kind: Namespace
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: {{ dune_online.unified_microservices.image }}:{{ dune_online.unified_microservices.tag }}
      - op: replace
        path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/key
        value: {{ kubernetes_labels.node_worker }}

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /metadata/name
        value: elisa-logbook-{{ thishardware }}

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /metadata/labels/elisa-logbook-type
        value: {{ logbooktype }}
      - op: replace
        path: /spec/selector/matchLabels/elisa-logbook-type
        value: {{ logbooktype }}
      - op: replace
        path: /spec/template/metadata/labels/elisa-logbook-type
        value: {{ logbooktype }}

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /metadata/labels/elisa-logbook-hardware
        value: {{ thishardware }}
      - op: replace
        path: /spec/selector/matchLabels/elisa-logbook-hardware
        value: {{ thishardware }}
      - op: replace
        path: /spec/template/metadata/labels/elisa-logbook-hardware
        value: {{ thishardware }}

  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/1/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/1/value
        value: {{ thishardware }}
