---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ dune_online.kafka.namespace }}

resources:
  - pod-monitors/entity-operator-metrics.yaml
  - pod-monitors/kafka-resources-metrics.yaml
  - default-metrics/kafka-metrics.yaml

patches:
  - target:
      kind: PodMonitor
    patch: |-
      - op: add
        path: /metadata/labels/{{ prometheus_podmonitor_label_name | replace('/', '~1') }}
        value: "{{ prometheus_podmonitor_labels.kafka }}"
      - op: add
        path: /spec/namespaceSelector/matchNames/0
        value: {{ dune_online.kafka.namespace }}
      - op: replace
        path: /spec/podMetricsEndpoints/0/scrapeTimeout
        value: "30s"
      - op: replace
        path: /spec/podMetricsEndpoints/0/interval
        value: "60s"
  - target:
      kind: KafkaNodePool
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER
  - target:
      kind: Kafka
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER


