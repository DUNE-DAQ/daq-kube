---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ dune_online.kafka.pool }}
  namespace: {{ dune_online.kafka.namespace }}
  labels:
    strimzi.io/cluster: {{ dune_online.kafka.name }}
spec:
  replicas: {{ dune_online.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral # no persistance requested for kafka topics
        kraftMetadata: shared
  resources:
    requests:
      memory: 1280Mi
      cpu: 200m
    limits:
      memory: 64Gi
      cpu: 12
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ dune_online.kafka.name }}
  namespace: {{ dune_online.kafka.namespace }}
spec:
  entityOperator:
    topicOperator:
      resources: # this is guess work
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          cpu: 400m
          memory: 384Mi
    userOperator:
      resources: # this is guess work
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          cpu: 400m
          memory: 384Mi
    template:
      pod:
        affinity:
         nodeAffinity:
           preferredDuringSchedulingIgnoredDuringExecution:
           - weight: 50
             preference:
              matchExpressions:
              - key: kafka.strimzi.io/name
                operator: In
                values:
                - strimzi-cluster-operator
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key: {{ kubernetes_labels.node_worker }}
                 operator: Exists
  kafkaExporter:
    resources: # this is guess work
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 400m
        memory: 128Mi
    topicRegex: ".*"
    groupRegex: ".*"
    template:
      pod:
        affinity:
         nodeAffinity:
           preferredDuringSchedulingIgnoredDuringExecution:
           - weight: 50
             preference:
              matchExpressions:
              - key: kafka.strimzi.io/cluster
                operator: In
                values:
                - {{ dune_online.kafka.name }}
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key: {{ kubernetes_labels.node_worker }}
                 operator: Exists
{% if dune_online.kafka.replicas > 1 %}
  cruiseControl:
    resources: # this is guess work
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 400m
        memory: 512Mi
    template:
      pod:
        affinity:
         nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
             preference:
              matchExpressions:
              - key: "kafka.strimzi.io/name"
                operator: In
                values:
                - "strimzi-cluster-operator"
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key: {{ kubernetes_labels.node_worker }}
                 operator: Exists
{% endif %}
  kafka:
    template:
      pod:
        affinity:
         nodeAffinity:
           preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                - key: kafka.strimzi.io/operator
                  operator: NotIn
                  values:
                  - "true"
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key: {{ kubernetes_labels.node_worker }}
                 operator: Exists
    logging:
      type: inline
{% if not development_instance %}
      loggers:
        kafka.root.logger.level: WARN
{% endif %}
    jvmOptions: # Tuning suggest 8Gi max?
      "-Xms": 1024m
      "-Xmx": 8192m
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          createBootstrapService: true
          useServiceDnsDomain: true
      - name: tls
        port: 9093
        type: internal
        tls: true
        configuration:
          createBootstrapService: true
          useServiceDnsDomain: true
      - name: external
        port:  9094
        type: nodeport
        tls: false
        configuration:
          createBootstrapService: true
          bootstrap:
            nodePort: 30092
          brokers:
{% for broker in range(dune_online.kafka.replicas) %}
          - broker: {{ broker }}
            nodePort: 3119{{ broker }} # keep nodePorts static so we can easily find them
{% if inside_kind %}
            advertisedHost: {{ kafka_hostname }}
{% endif %}
{% endfor %}
    config:
      auto.create.topics.enable: true
      log.cleanup.policy: delete # Cannot use 'compact' due to empty key in our data format
      log.retention.bytes: 6442450944 # no default upper size limit, set to 6Gi

      message.max.bytes: 402653184 # if you change this you need to review the kafka docs
      replica.fetch.max.bytes: 402653184 # if you change this you need to review the kafka docs
      replica.fetch.response.max.bytes: 402653184 # if you change this you need to review the kafka docs
      max.partition.fetch.bytes: 402653184 # if you change this you need to review the kafka docs
{% if dune_online.kafka.replicas < 3 %}
      # replication only makes sense if there are 3 or more brokers
      transaction.state.log.min.isr: 1
      min.insync.replicas: 1
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      num.partitions: 1
{% else %}
      # replicate to n/2 for stability at small replica counts
      transaction.state.log.min.isr: {{ (dune_online.kafka.replicas / 2)  | round | int }}
      min.insync.replicas: {{ (dune_online.kafka.replicas / 2) | round | int }}
      default.replication.factor: {{ (dune_online.kafka.replicas / 2) | round | int }}
      offsets.topic.replication.factor: {{ (dune_online.kafka.replicas / 2) | round | int }}
      transaction.state.log.replication.factor: {{ (dune_online.kafka.replicas / 2) | round | int }}
      num.partitions: {{ (dune_online.kafka.replicas / 2) | round | int }}
{% endif %}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
