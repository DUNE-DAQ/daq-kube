---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ dune_online_runservices.database.postgresql.deployment }}-{{ dune_online_runservices.database.postgresql.owner }}-password
  namespace: {{ dune_online_runservices.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ dune_online_runservices.database.postgresql.owner }}
{% raw %}
        password: "{{ .uuid }}"
{% endraw %}
        database: {{ dune_online_runservices.database.postgresql.database }}
        host: {{ dune_online_runservices.database.postgresql.deployment }}-rw.{{ dune_online_runservices.namespace }}.svc
        port: '5432'
        uri: "postgresql://{{ dune_online_runservices.database.postgresql.owner }}:{% raw %}{{ .uuid }}{% endraw %}@{{ dune_online_runservices.database.postgresql.deployment }}-rw.{{ dune_online_runservices.namespace }}.svc:5432/{{ dune_online_runservices.database.postgresql.database }}"
        pyuri: "postgresql+psycopg://{{ dune_online_runservices.database.postgresql.owner }}:{% raw %}{{ .uuid }}{% endraw %}@{{ dune_online_runservices.database.postgresql.deployment }}-rw.{{ dune_online_runservices.namespace }}.svc:5432/{{ dune_online_runservices.database.postgresql.database }}"
  dataFrom:
    - sourceRef:
        generatorRef: {{ external_secrets.uuid | tojson }}
