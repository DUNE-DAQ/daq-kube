---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ dune_online_runservices.database.postgresql.deployment }}-tls-cert
  namespace: {{ dune_online_runservices.namespace }}
spec:
  secretName: {{ dune_online_runservices.database.postgresql.deployment }}-tls-cert
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Always
  signatureAlgorithm: SHA512WithRSA
  usages:
    - server auth
  dnsNames:
    - {{ dune_online_runservices.database.postgresql.deployment }}-rw
    - {{ dune_online_runservices.database.postgresql.deployment }}-rw.{{ dune_online_runservices.namespace }}
    - {{ dune_online_runservices.database.postgresql.deployment }}-rw.{{ dune_online_runservices.namespace }}.svc
    - {{ dune_online_runservices.database.postgresql.deployment }}-r
    - {{ dune_online_runservices.database.postgresql.deployment }}-r.{{ dune_online_runservices.namespace }}
    - {{ dune_online_runservices.database.postgresql.deployment }}-r.{{ dune_online_runservices.namespace }}.svc
    - {{ dune_online_runservices.database.postgresql.deployment }}-ro
    - {{ dune_online_runservices.database.postgresql.deployment }}-ro.{{ dune_online_runservices.namespace }}
    - {{ dune_online_runservices.database.postgresql.deployment }}-ro.{{ dune_online_runservices.namespace }}.svc
  issuerRef:
    name: {{ certmanager.ca_name }}
    kind: ClusterIssuer
