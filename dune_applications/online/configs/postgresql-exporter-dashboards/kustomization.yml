---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ monitoring.namespace }}

generatorOptions:
  disableNameSuffixHash: true
  labels:
    {{ grafana_dashboard_label_name }}: {{ grafana_dashboard_label_value }}

commonAnnotations:
  grafana_folder: "Postgresql"

configMapGenerator:
  - name: postgres-exporter-overview-dashboard
    files: [ dashboards/postgres-overview.json ]
