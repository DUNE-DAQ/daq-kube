yamlApplicationConfig:
  kafka:
    clusters:
      - name: {{ dunedaq.kafka.name }}
        bootstrapServers: {{ dunedaq.kafka.name }}-kafka-bootstrap:9092
        readOnly: false
#        properties:
#          security.protocol: SASL_PLAINTEXT
#          sasl.mechanism: PLAIN
#          sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="ddd" password="eee";

env:
  - name: DYNAMIC_CONFIG_ENABLED
    value: "true"

resources:
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 256Mi

networkPolicy:
  enabled: true
  egressRules:
    customRules: # host port could be anything
      - {}
  ingressRules:
    customRules: # need to lock this down better
      - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
        ports:
          - protocol: TCP
            port: 80

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: {{ kubernetes_label.worker }}
          operator: Exists
  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions: # try to schedule near Kafka
          - key: "strimzi.io/cluster"
            operator: In
            values:
            - "{{ dunedaq.kafka.name }}"
        topologyKey: kubernetes.io/hostname
