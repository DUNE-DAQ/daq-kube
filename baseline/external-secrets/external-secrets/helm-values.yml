---
extraArgs:
  zap-time-encoding: "rfc3339"
{% if development_instance %}
  loglevel: debug
{% else %}
  loglevel: warn
{% endif %}

webhook:
  certManager:
    enabled: false # when enabled webhook gets stuck in a loop every 15m - cert expires?
    cert:
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: {{ certmanager.ca_name }}
      duration: "168h"
      renewBefore: "72h"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources: # this is guess work
    limits:
      cpu: 100m
      memory: 96Mi
    requests:
      cpu: 10m
      memory: 64Mi

certController:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources: # this is guess work
    limits:
      cpu: 100m
      memory: 96Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceMonitor:
  enabled: true
  renderMode: alwaysRender
  additionalLabels:
    {{ prometheus_servicemonitor_label_name }}: {{ prometheus_servicemonitor_labels.system }}

grafanaDashboard:
  enabled: true
  sidecarLabel: {{ grafana_dashboard_label_name }}
  sidecarLabelValue: {{ grafana_dashboard_label_value }}
  annotations:
    {{ grafana_dashboard_folder_annotation }}: External Secrets

resources: # this is guess work
  limits:
    cpu: 100m
    memory: 96Mi
  requests:
    cpu: 10m
    memory: 64Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

livenessProbe:
  enabled: true

global:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: {{ kubernetes_labels.node_worker }}
            operator: Exists
