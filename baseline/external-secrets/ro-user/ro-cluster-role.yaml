---
# ServiceAccount for read-only access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: read-only-user
  namespace: {{ external_secrets.lookup_namespace }}
---
# Bind the read-only role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: read-only-user-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-only-user
subjects:
  - kind: ServiceAccount
    name: read-only-user
    namespace: {{ external_secrets.lookup_namespace }}
---
# Token secret for authentication
apiVersion: v1
kind: Secret
metadata:
  name: read-only-user-token
  namespace: {{ external_secrets.lookup_namespace }}
  annotations:
    kubernetes.io/service-account.name: read-only-user
type: kubernetes.io/service-account-token
