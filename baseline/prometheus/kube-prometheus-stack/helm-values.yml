---
## Make sure things have workable names
fullnameOverride: "kube-prometheus-stack"
cleanPrometheusOperatorObjectNames: true

global:
  createAggregateClusterRoles: true

## Create default rules for monitoring the cluster
##
defaultRules:
  create: true

## do create the prometheus-operator
##
prometheusOperator:
  enabled: true
  networkPolicy:
    enabled: true

{% if inside_kind %}
  hostUsers: true
{% else %}
  hostUsers: false
{% endif %}

  resources: # this is guess work
    limits:
      cpu: 300m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 96Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  prometheusConfigReloader:
    resources: # this is guess work
      limits:
        cpu: 300m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
  admissionWebhooks:
    patch:
      resources: # this is guess work
        limits:
          cpu: 500m
          memory: 384Mi
        requests:
          cpu: 10m
          memory: 64Mi

## do not deploy a default monitoring setup
## we will manage it seperately
prometheus:
  enabled: false
  forceDeployDashboards: true
alertmanager:
  enabled: false
  forceDeployDashboards: true
nodeExporter:
  enabled: false
  forceDeployDashboards: true
kubeStateMetrics:
  enabled: false
  forceDeployDashboards: true

## do not deploy the grafana server here
## we will manage it seperately
grafana:
  enabled: false
  defaultDashboardsEnabled: true
  forceDeployDashboards: true

  sidecar:
    dashboards:
      annotations:
        {{ grafana_dashboard_folder_annotation }}: Kubernetes
      label: {{ grafana_dashboard_label_name }}
      labelValue: {{ grafana_dashboard_label_value }}
