apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helm-rendered.yaml

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/labels/kluctl.io~1is-ready
        value: "true"
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /metadata/labels/kluctl.io~1is-ready
        value: "true"
