---
deployments:
  - path: namespace
    alwaysDeploy: true

  - barrier: true
    message: We need a namespace to deploy into
    waitReadinessObjects:
      - kind: Namespace
        name: "{{ certmanager.namespace }}"

  - path: cert-manager
    waitReadiness: false

  - barrier: true
    message: We need the cert-manager CRDs to continue
    waitReadiness: false
    waitReadinessObjects:
      - kind: CustomResourceDefinition
        name: clusterissuers.cert-manager.io
      - kind: CustomResourceDefinition
        name: certificates.cert-manager.io
      - kind: CustomResourceDefinition
        name: certificaterequests.cert-manager.io

  - path: cert-manager-ca
