crds:
  enabled: true

enableCertificateOwnerRef: true

deploymentAnnotations:
  "kluctl.io/is-ready": "true"

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    prometheusInstance: {{ prometheus_servicemonitor_labels.system }}

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 96Mi

affinity:
 nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
     nodeSelectorTerms:
     - matchExpressions:
       - key: {{ kubernetes_label.worker }}
         operator: Exists

podDisruptionBudget:
  enabled: true
  minAvailable: 0

#extraArgs:
#  - '--enable-gateway-api'

webhook:
  affinity:
   nodeAffinity:
     requiredDuringSchedulingIgnoredDuringExecution:
       nodeSelectorTerms:
       - matchExpressions:
         - key: {{ kubernetes_label.worker }}
           operator: Exists
  podDisruptionBudget:
    enabled: true
    minAvailable: 0
  deploymentAnnotations:
    "kluctl.io/is-ready": "true"
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi
  networkPolicy:
    enabled: false

cainjector:
  affinity:
   nodeAffinity:
     requiredDuringSchedulingIgnoredDuringExecution:
       nodeSelectorTerms:
       - matchExpressions:
         - key: {{ kubernetes_label.worker }}
           operator: Exists
  podDisruptionBudget:
    enabled: true
    minAvailable: 0
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi

startupapicheck:
  affinity:
   nodeAffinity:
     requiredDuringSchedulingIgnoredDuringExecution:
       nodeSelectorTerms:
       - matchExpressions:
         - key: {{ kubernetes_label.worker }}
           operator: Exists
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
