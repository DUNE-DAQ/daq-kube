crds:
  enabled: false
#  renderMode: alwaysRender

enableCertificateOwnerRef: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      {{ prometheus_servicemonitor_label_name }}: {{ prometheus_servicemonitor_labels.system }}

resources: # this is guess work
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 96Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ kubernetes_labels.node_worker }}
              operator: Exists

podDisruptionBudget:
  enabled: true
  maxUnavailable: 0
#  unhealthyPodEvictionPolicy: AlwaysAllow

#extraArgs:
#  - '--enable-gateway-api'

livenessProbe:
  enabled: true

webhook:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  deploymentAnnotations:
    "kluctl.io/is-ready": "true"
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi
  networkPolicy:
    enabled: false

cainjector:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi

startupapicheck:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
