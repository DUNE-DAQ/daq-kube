crds:
  enabled: false

global:
{% if inside_kind %}
  hostUsers: true
{% else %}
  hostUsers: false
{% endif %}

enableCertificateOwnerRef: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      {{ prometheus_servicemonitor_label_name }}: {{ prometheus_servicemonitor_labels.system }}

resources: # this is guess work
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 96Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ kubernetes_labels.node_worker }}
              operator: Exists

podDisruptionBudget:
  enabled: true
  minAvailable: 1
#  unhealthyPodEvictionPolicy: AlwaysAllow

#extraArgs:
#  - '--enable-gateway-api'

livenessProbe:
  enabled: true

webhook:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  deploymentAnnotations:
    "kluctl.io/is-ready": "true" # if unset, this hangs as it is CNI dependent
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi
  networkPolicy:  # because this launches in parallel with CNI, can't set IPBlocks
    enabled: true
    ingress:
      - ports:
        - port: 10250
          protocol: TCP
        - port: 6080
          protocol: TCP
        - port: 9402
          protocol: TCP
    egress:
      - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 80
          protocol: TCP

cainjector:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 96Mi

startupapicheck:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: {{ kubernetes_labels.node_worker }}
                operator: Exists
  resources: # this is guess work
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi
