---
resources: # this is guess work
  limits:
    cpu: 300m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 64Mi

nodePathMap: {{ local_path_provisioner.nodePathMap | tojson }}

storageClass:
  create: true
  name: {{ local_path_provisioner.storage_class_name }}
  defaultClass: {{ local_path_provisioner.is_default_class }}
  reclaimPolicy: Retain
{%- raw %}
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
{% endraw %}

affinity:
 nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
     nodeSelectorTerms:
     - matchExpressions:
       - key: {{ kubernetes_labels.node_worker }}
         operator: Exists

{% if inside_kind %}
hostUsers: true
{% else %}
hostUsers: false
{% endif %}

podSecurityContext:
  runAsNonRoot: true

# NOTE: launches a helper pod with hostPath volume
#       thus namespace must permit PSS privileged
#       last checked kubernetes 1.35
securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: ["ALL"]
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true

podDisruptionBudget:
  enabled: true
  minAvailable: 0
