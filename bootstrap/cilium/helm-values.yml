---
cluster:
  name: "{{ target.name }}"

cni:
  install: true
  binPath: /opt/cni/bin  # cri-o on fedora uses : /usr/libexec/cni

bpf:
  masquerade: true
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.05
  preallocateMaps: true

# Top-level key - not nested under bpf
bpfClockProbe: true

pmtuDiscovery:
  enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
    trustCRDsExist: true
    labels:
      "{{ prometheus_servicemonitor_label_name }}": "{{ prometheus_servicemonitor_labels.system }}"
  # controllerGroupMetrics: "all" generates high cardinality at scale.
  # The list below covers operator health, policy churn, and endpoint
  # lifecycle - sufficient for a production cluster without flooding
  # Prometheus.
  # Expand as you add features
  controllerGroupMetrics:
    - write-cnp-status
    - cilium-node-gc
    - cilium-endpoint-gc
    - endpoint-regeneration
    - policy-import

dashboards:
  enabled: true
  label: "{{ grafana_dashboard_label_name }}"
  labelValue: "{{ grafana_dashboard_label_value }}"
  annotations:
    "{{ grafana_dashboard_folder_annotation }}": Cilium

resourceQuotas:
  enabled: true

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 300m
    memory: 512Mi

priorityClassName: system-node-critical

initResources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 32Mi

cgroup:
  autoMount:
    enabled: true
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 32Mi

nodeinit:
  enabled: true
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

operator:
  enabled: true
  rollOutPods: true
  replicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    unhealthyPodEvictionPolicy: AlwaysAllow
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: "30s"
      labels:
        "{{ prometheus_servicemonitor_label_name }}": "{{ prometheus_servicemonitor_labels.system }}"
  dashboards:
    enabled: true
    label: "{{ grafana_dashboard_label_name }}"
    labelValue: "{{ grafana_dashboard_label_value }}"
    annotations:
      "{{ grafana_dashboard_folder_annotation }}": Cilium

hubble:
  enabled: true
  preferIpv6: false
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - flows-to-world
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
      interval: "30s"
      labels:
        "{{ prometheus_servicemonitor_label_name }}": "{{ prometheus_servicemonitor_labels.system }}"
  dashboards:
    enabled: true
    label: "{{ grafana_dashboard_label_name }}"
    labelValue: "{{ grafana_dashboard_label_value }}"
    annotations:
      "{{ grafana_dashboard_folder_annotation }}": Cilium
  tls:
    auto:
      enabled: true
      method: certmanager
      # 3660 days (~10 years). Long validity reduces rotation risk
      # for a long-lived cluster. Rotate manually if CA is compromised.
      certValidityDuration: 3660
      certManagerIssuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: "{{ certmanager.ca_name }}"
  relay:
    enabled: true
    podDisruptionBudget:
      enabled: true
      unhealthyPodEvictionPolicy: AlwaysAllow
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "{{ kubernetes_labels.node_worker }}"
                  operator: Exists
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                k8s-app: cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: "30s"
        labels:
          "{{ prometheus_servicemonitor_label_name }}": "{{ prometheus_servicemonitor_labels.system }}"
  ui:
    enabled: true
    podDisruptionBudget:
      enabled: true
      unhealthyPodEvictionPolicy: AlwaysAllow
    backend:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 20m
          memory: 64Mi
    frontend:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 64Mi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "{{ kubernetes_labels.node_worker }}"
                  operator: Exists

### Cilium handles CNI only - Disable non-CNI features
kubeProxyReplacement: false

bandwidthManager:
  enabled: false

bgpControlPlane:
  enabled: false

endpointRoutes:
  enabled: false

ingressController:
  enabled: false

envoy:
  enabled: false

gatewayAPI:
  enabled: false

ipam:
  mode: kubernetes
