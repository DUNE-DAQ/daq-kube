apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: "{{ certmanager.namespace }}"

resources:
  - helm-rendered.yaml

# to make a "CRD" only version of this chart remove:
# - all objects in a namespace
# -
patches:
  - target:
      namespace: "{{ certmanager.namespace }}"
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER
  - target:
      kind: "(ClusterRole|ClusterRoleBinding|Role|RoleBinding|NetworkPolicy|MutatingWebhookConfiguration|ValidatingWebhookConfiguration)"
    patch: |-
      $patch: delete
      kind: Kustomization
      metadata:
        name: DOES NOT MATTER
