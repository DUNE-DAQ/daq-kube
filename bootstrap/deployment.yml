---
deployments:
  - path: kube-system
    alwaysDeploy: true
    skipDeleteIfTags: true

  - path: common-namespaces
    alwaysDeploy: true
    skipDeleteIfTags: true

  - path: prometheus-operator-crds
    alwaysDeploy: true
    skipDeleteIfTags: true
    tags:
      - metrics
      - monitoring
      - alertmanager
      - prometheus
      - prometheus-operator

  - path: cert-manager-crds
    alwaysDeploy: true
    skipDeleteIfTags: true
    tags:
      - pki
      - tls

  - barrier: true
    message: CRDs need to settle

  - include: reflector

  - barrier: true
    message: Ensure reflector is ready

{% if with_cilium %}
  - path: cilium
    tags:
      - cni
    skipDeleteIfTags: true

  - barrier: true
    message: If the CNI doesn't settle you can't launch any containers
{% endif %}

  - path: cert-manager
    tags:
      - pki
      - tls

  - include: local-storage
    tags:
      - csi
      - storage

  - barrier: true
    message: some cluster bootstrap services need to settle right now or else nothing works

  - path: cert-manager-ca
    skipDeleteIfTags: true
    tags:
      - pki
      - tls

  - barrier: true
    message: Cluster CA(s) need to generate

  - barrier: true
    message: bootstrap need to settle
