---
deployments:
  - path: kube-system
    alwaysDeploy: true

  - path: debug
    alwaysDeploy: true

  - path: prometheus-operator-crds
    alwaysDeploy: true
    tags:
      - metrics
      - monitoring
      - alertmanager
      - prometheus
      - prometheus-operator

  - barrier: true
    message: Prometheus CRDs need to settle

  - include: cert-manager
    tags:
      - pki
      - tls

{% if with_cilium %}
  - include: cilium
    tags:
      - cni
    skipDeleteIfTags: true
{% endif %}

  - barrier: true
    message: some cluster bootstrap services need to settle before storage is discovered

  - include: local-storage
    tags:
      - csi
      - storage

  - barrier: true
    message: bootstrap pods need to settle
