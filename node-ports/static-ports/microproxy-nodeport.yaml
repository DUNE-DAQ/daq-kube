---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks-nodeport
  namespace: microsocks
spec:
  type: NodePort
  ports:
    - name: socks5
      protocol: TCP
      port: 1080
      targetPort: socks5
      nodePort: 31000
  selector:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
