---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/instance: alertmanager-main
    app.kubernetes.io/name: alertmanager
  name: alertmanager-main-nodeport
  namespace: monitoring
spec:
  type: NodePort
  ports:
  - name: service
    protocol: TCP
    port: 9093
    targetPort: web
    nodePort: 31092
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: main
