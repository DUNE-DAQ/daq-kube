{% if development_instance %}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: grafana-devel
    app.kubernetes.io/name: grafana
  name: grafana-server-devel-nodeport
  namespace: monitoring
spec:
  type: NodePort
  ports:
  - name: service
    protocol: TCP
    port: 80
    targetPort: grafana
    nodePort: 31023
  selector:
    app.kubernetes.io/instance: grafana-devel
    app.kubernetes.io/name: grafana
{% endif %}
