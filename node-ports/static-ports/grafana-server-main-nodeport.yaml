---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
  name: grafana-server-main-nodeport
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - name: service
      protocol: TCP
      port: 80
      targetPort: grafana
      nodePort: 31003
  selector:
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/name: grafana
