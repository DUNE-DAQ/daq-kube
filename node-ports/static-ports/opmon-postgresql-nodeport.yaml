---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: opmon
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance: opmon-database-rw
  name: opmon-postgresql-nodeport
  namespace: opmon
spec:
  type: NodePort
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30433
  selector:
    cnpg.io/cluster: opmon-database
    cnpg.io/instanceRole: primary
