---
# There is a known issue where
# Secret/kubernetes-dashboard-key-holder
# loses its labels and annotations after initial startup
# https://github.com/kubernetes/dashboard/issues/7731

# Dashboard 3.0 changes/moves most of these parameters

fullnameOverride: 'kubernetes-dashboard'

image:
  repository: docker.io/kubernetesui/dashboard   # use fully qualified container name

cert-manager:
  enabled: false

nginx:
  enabled: false

metricsScraper:
  enabled: true
  image:
    repository: docker.io/kubernetesui/metrics-scraper   # use fully qualified container name

networkPolicy:
  enabled: true
  ingressDenyAll: {{ kubernetes_dashboard.deny_all_ingress }}

serviceMonitor:
  enabled: true

{% if kubernetes_dashboard.enable_ro_user %}
rbac:
  # It is NOT RECOMMENDED to use this version in production.
  clusterReadOnlyRole: true
extraArgs:
  - --enable-skip-login
{% endif %}

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: {{ kubernetes_labels.node_worker }}
          operator: Exists
