config:
  inCluster: false  # actually true, but we are tricking with kubeconfig
  extraArgs:
    - "-kubeconfig=/tmp/.kube/config"

{%- if 'pocket' in target.name %}
  inClusterContextName: pocket
{%- else %}
  inClusterContextName: "{{ target.name }}"
{% endif %}
  unsafeUseServiceAccountToken: true

env:
- name: HOME
  value: /tmp/headlamp

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: empty
    mountPath: /headlamp/static-plugins
  - name: kubeconfig
    mountPath: /tmp/.kube
    readOnly: true

volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
  - name: empty
    emptyDir:
      sizeLimit: 4Mi
  - name: kubeconfig
    secret:
      secretName: headlamp-kubeconfig
      items:
        - key: config
          path: config

serviceAccount:
  name: headlamp-read-only
clusterRoleBinding:
  clusterRoleName: read-only-user

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  privileged: false
  runAsUser: 1002
  runAsGroup: 1002
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources: # this is guess work
 limits:
   cpu: 1
   memory: 1Gi
 requests:
   cpu: 100m
   memory: 128Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: {{ kubernetes_labels.node_worker }}
              operator: Exists

podDisruptionBudget:
  enabled: true

extraManifests:
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: headlamp-use-proxy
    rules:
      - apiGroups: [""]
        resources: ["services/proxy"]
        verbs: ["get"]
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: headlamp-use-proxy
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: headlamp-use-proxy
    subjects:
      - kind: ServiceAccount
        name: headlamp-read-only
        namespace: headlamp
