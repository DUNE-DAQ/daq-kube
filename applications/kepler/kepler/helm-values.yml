---
daemonset:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 10
    periodSeconds: 120

  readinessProbe:
    httpGet:
      path: /metrics
      port: http
    initialDelaySeconds: 10
    periodSeconds: 120

networkPolicy:
  enabled: true
  egress:
    - ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 53
      - protocol: UDP
        port: 53

serviceMonitor:
  enabled: true
  interval: 35s
  labels:
    {{ prometheus_servicemonitor_label_name }}: {{ prometheus_servicemonitor_labels.system }}
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: "kepler_process_.*"
      action: drop

dashboards:
  enabled: true
  labels:
    {{ grafana_dashboard_label_name }}: {{ grafana_dashboard_label_value }}
  annotations:
    {{ grafana_dashboard_folder_annotation }}: Kubernetes
