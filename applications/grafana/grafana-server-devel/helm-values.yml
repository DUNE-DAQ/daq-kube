---
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

serviceMonitor:
  enabled: true
  labels:
    {{ prometheus_servicemonitor_label_name }}: {{ prometheus_servicemonitor_labels.system }}

networkPolicy:
  enabled: true

useStatefulSet: true

persistence:
  enabled: true

initChownData:
  enabled: false

grafana.ini:
{% if smtp_server.address %}
  smtp:
    enabled: true
    host: {{ smtp_server.address }}:{{ smtp_server.port }}
  emails:
    welcome_email_on_sign_up: true
{% else %}
  smtp:
    enabled: false
{% endif %}
  paths:
    data: /var/lib/grafana/
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
    temp_data_lifetime: 12h
  server:
    enable_gzip: true
  database:
    log_queries: false
    wal: true # wal for sqlite only
    query_retries: 5 # query_retries for sqlite only
  analytics:
    check_for_updates: true
    check_for_plugin_updates: true
    reporting_enabled: false
  auth:
    login_maximum_inactive_lifetime_duration: 13h
    login_maximum_lifetime_duration: 10d
{% if 'pocket' in target.name %}
    login_cookie_name: "grafana_session_pocket_devel"
{% else %}
    login_cookie_name: "grafana_session_{{ target.name }}_devel"
{% endif %}
  auth.anonymous:
    enabled: true # make sure to clean your cookies or else!
    org_role: Viewer
    org_name: Main Org.
    hide_version: true
  security:
{% if 'pocket' in target.name %}
    admin_email: root@pocket
{% else %}
    admin_email: root@{{ target.name }}
{% endif %}
    disable_gravatar: true
  users:
    allow_sign_up: false
    allow_org_create: false
    default_theme: dark
  log:
    mode: console

resources: # this is guess work
 limits:
   cpu: 3
   memory: 4Gi
 requests:
   cpu: 10m
   memory: 128Mi

# try not to schedule on same node as alertmanager/prometheus
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: {{ kubernetes_labels.node_worker }}
          operator: Exists
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 10
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: alertmanager
              operator: Exists
          topologyKey: kubernetes.io/hostname
      - weight: 20
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: prometheus
              operator: Exists
          topologyKey: kubernetes.io/hostname
      - weight: 30 # also avoid scheduling alongside grafana-main
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: statefulset.kubernetes.io/pod-name
              operator: In
              values:
              - grafana-0
          topologyKey: kubernetes.io/hostname

service:
  labels:
    grafana: grafana-devel
