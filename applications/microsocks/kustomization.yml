---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - microsocks.yml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/hostUsers
{% if inside_kind %}
        value: true
{% else %}
        value: false
{% endif %}
