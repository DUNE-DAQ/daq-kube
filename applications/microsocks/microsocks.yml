---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kluctl.io/skip-delete-if-tags: "true"
    kluctl.io/wait-readiness: "true"
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: microsocks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks
  namespace: microsocks
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/app: microsocks
      app.kubernetes.io/component: microsocks
  template:
    metadata:
      labels:
        app.kubernetes.io/app: microsocks
        app.kubernetes.io/component: microsocks
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ kubernetes_labels.node_worker }}
                    operator: Exists
        podAntiAffinity: # try to spread across different workers
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/app: microsocks
                    app.kubernetes.io/component: microsocks
                topologyKey: "kubernetes.io/hostname"
      automountServiceAccountToken: false
{% if inside_kind %}
      hostUsers: true
{% else %}
      hostUsers: false
{% endif %}
      containers:
        - image: ghcr.io/dune-daq/microsocks:latest
          imagePullPolicy: Always
          name: microsocks
          ports:
            - containerPort: 1080
              name: socks5
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: socks5
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: socks5
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              memory: 128Mi
              cpu: 500m
            requests:
              memory: 8Mi
              cpu: 100m
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 10000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks-pdb
  namespace: microsocks
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/app: microsocks
      app.kubernetes.io/component: microsocks
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks
  namespace: microsocks
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: microsocks
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks
  namespace: microsocks
spec:
  ports:
    - name: socks5
      protocol: TCP
      port: 1080 # 1080 is the ICANN socks5 port
      targetPort: socks5
  selector:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/app: microsocks
    app.kubernetes.io/component: microsocks
  name: microsocks-network-policy
  namespace: microsocks
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/app: microsocks
      app.kubernetes.io/component: microsocks
  policyTypes:
    - Ingress
    - Egress
  ingress: # this policy is intentionally pretty wide open
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 1080
  egress:
    - {}
